<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>C&C Tiberian Dawn — Remastered</title>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, Helvetica, sans-serif;
}

/* ===== TOP BRAND BAR (SAFE ZONE) ===== */
#brand-bar {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(
    to bottom,
    rgba(0,0,0,0.85),
    rgba(0,0,0,0.6)
  );
  border-bottom: 1px solid rgba(120,255,120,0.35);
  color: #9fffa0;
  font-size: 13px;
  letter-spacing: 0.6px;
  text-shadow: 0 0 6px rgba(0,255,0,0.35);
  pointer-events: none; /* IMPORTANT */
  z-index: 10;
}

#brand-bar strong {
  color: #ffffff;
}

/* ===== FULLSCREEN BUTTON ===== */
#fsBtn {
  position: fixed;
  top: 6px;
  right: 10px;
  z-index: 11;
  background: rgba(0,0,0,0.65);
  color: white;
  border: 1px solid rgba(255,255,255,0.4);
  padding: 6px 10px;
  font-size: 12px;
  border-radius: 4px;
}

/* ===== GAME WRAPPER ===== */
#game-wrapper {
  position: absolute;
  top: calc(50% + 18px); /* push game BELOW brand bar */
  left: 50%;
  transform-origin: center center;
}

/* FIXED INTERNAL RESOLUTION */
canvas {
  width: 640px;
  height: 535px;
  background: black;
  display: block;
  cursor: none;
}
</style>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/1.7/jquery.min.js"></script>
<script src="js/cnc-v0.3d.js"></script>
</head>

<body>

<div id="brand-bar">
  REMASTERED BY <strong> FutureT3ch</strong> × <strong>MemeTorrent</strong>
</div>

<button id="fsBtn">FULLSCREEN</button>

<div id="game-wrapper">
  <canvas id="canvas" width="640" height="535"></canvas>
</div>

<script>
const wrapper = document.getElementById("game-wrapper");

const BASE_W = 640;
const BASE_H = 535;

function resizeGame() {
  const scale = Math.min(
    window.innerWidth / BASE_W,
    (window.innerHeight - 36) / BASE_H
  );

  wrapper.style.transform =
    `translate(-50%, -50%) scale(${scale})`;
}

window.addEventListener("resize", resizeGame);
window.addEventListener("orientationchange", resizeGame);
resizeGame();

/* Fullscreen */
document.getElementById("fsBtn").onclick = () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen();
  } else {
    document.exitFullscreen();
  }
};
</script>

</body>
</html>
